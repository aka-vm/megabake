[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "megabake"
version = "0.1.0"
description = "PyTorch FX to CuTe CUDA megakernels"
license = {text = "MIT"}
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch>=2.14",
    "nvidia-cutlass-dsl[cu13]==4.8.0",
    "nvidia-cutlass>=4.2.0.0",
    "safetensors>=0.8.0",
    "huggingface-hub>=1.33.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "transformers>=5.18.0",
    "numpy>=2.5.3",
    "ruff>=0.9.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
megabake = "megabake.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
extend-ignore = [
    # Generated CUDA source and diagnostics intentionally concatenate string fragments.
    "ISC004",
    # Nested guards separate CuTe compile-time conditions from device conditions.
    "SIM102",
    # Keep nested context managers readable, especially CUDA capture/error scopes.
    "SIM117",
]
