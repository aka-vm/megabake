[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "megabake"
version = "0.1.0"
description = "PyTorch FX to CuTe CUDA megakernels"
license = {text = "MIT"}
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch>=2.14",
    "safetensors>=0.8.0",
    "huggingface-hub>=1.33.0,<2.0",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cutlass-dsl[cu13]==4.8.0",
    "nvidia-cutlass>=4.2.0.0",
]
dev = [
    "pytest>=9.1.1",
    "transformers>=5.18.0",
    "numpy>=2.5.3",
    "ruff==0.17.3",
    "pre-commit>=4.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
megabake = "megabake.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = [
    # This snapshot is hash-pinned and must remain byte-for-byte identical to upstream.
    "src/megabake/bodies/cuda/sm90/cutlass_upstream",
]

[tool.ruff.lint]
extend-ignore = [
    # Nested guards separate CuTe compile-time conditions from device conditions.
    "SIM102",
    # Allow 'l' as dimension variable in GEMM/tensor coordinates (M, N, K, L).
    "E741",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "gpu: tests requiring an NVIDIA CUDA GPU",
]
